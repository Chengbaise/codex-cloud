<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: https:; connect-src 'none'; object-src 'none'; base-uri 'none'"><title>拾图 · 多源漫画阅读器</title><link rel="stylesheet" href="style.css"></head>
<body><aside class="sidebar"><div class="brand"><span class="brand-icon">拾</span><div>拾图<small>COMIC EXPLORER</small></div></div><div class="section-label">我的漫画空间</div>
<button id="explore" class="nav active"><span>▧</span> 发现漫画</button><button id="library" class="nav"><span>♡</span> 我的书架</button><button id="sources" class="nav"><span>⊞</span> 漫画源</button><button id="downloads" class="nav"><span>↓</span> 下载管理 <i id="count">0</i></button><button id="browse" class="nav"><span>↗</span> 网页浏览</button><div class="sidebar-bottom"><span class="dot"></span> 多源 · 章节 · 阅读<p>添加你自己的漫画源<br>每个故事，都有入口</p></div></aside>
<header><div class="heading"><div><span class="eyebrow">YOUR COMIC LIBRARY</span><h1 id="heading">发现漫画</h1></div><div class="header-actions"><select id="source-select" aria-label="当前漫画源"></select><button id="choose" class="secondary">下载目录 ↗</button></div></div><form id="search-form"><select id="search-mode" aria-label="搜索类型"><option value="title">作品名称</option><option value="keyword">综合</option><option value="artist">作者</option></select><select id="search-match" aria-label="匹配方式"><option value="contains">包含匹配</option><option value="fuzzy">模糊匹配</option><option value="exact">精确匹配</option></select><input id="query" placeholder="输入完整或部分作品名称…" aria-label="搜索内容" maxlength="500"><button class="primary" type="submit">搜索 ↗</button></form><p id="search-hint" class="search-hint"></p></header>
<main id="comic-panel"><div id="comic-content"></div></main>
<main id="source-panel" hidden><span class="eyebrow">SOURCES</span><h2>故事，从这里开始。</h2><p class="muted">导入本软件的 JSON 漫画源，随时切换目录。支持目录源与统一 JSON API 源，暂不兼容 Venera JS。</p><div class="import-box"><div class="toolbar"><button id="import-file" class="primary">从文件导入</button><input id="source-url" placeholder="https://example.com/source.json" aria-label="源清单地址"><button id="import-url" class="secondary">从网址导入</button></div><details><summary>或粘贴源 JSON</summary><textarea id="source-json" rows="8" aria-label="源 JSON" placeholder='{"format":"atelier-source-v1", ...}'></textarea><button id="import-text" class="secondary">导入 JSON</button></details></div><div id="source-list"></div></main>
<main id="download-panel" hidden><div class="panel-title"><div><span class="eyebrow">DOWNLOADS</span><h2>每一章，妥善收藏。</h2><p id="directory"></p></div><button id="open-folder" class="secondary">打开文件夹 ↗</button></div><div id="jobs"></div><div id="empty"><span>↓</span><h3>还没有下载任务</h3><p>在漫画详情中选择章节下载，或在网页浏览中右键保存图片。</p></div></main>
<footer><div class="navigation"><button id="back" title="后退" aria-label="后退">←</button><button id="forward" title="前进" aria-label="前进">→</button><button id="reload" title="刷新" aria-label="刷新">↻</button><button id="home" title="网站首页" aria-label="网站首页">⌂</button></div><span id="status" role="status">漫画源就绪</span><span class="footer-right">拾图 / 0.2.1</span></footer><div id="toast" role="alert" hidden></div><script src="renderer.js"></script><script src="comics.js"></script></body></html>
